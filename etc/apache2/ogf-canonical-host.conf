# The site has one name, opengeofiction.net. www.opengeofiction.net is not
# served: it answers 404 with a one-line notice, never a redirect and never
# the site in parallel (which splits sessions, search results and OAuth
# redirect URIs between two hosts). A 301 was tried first and taught crawlers
# to follow it, doubling every request (2026-09-14); a 404 makes them drop
# the URL. nginx answers www itself (etc/nginx/sites-available), so the host
# rule below is only reached if a request for www is ever proxied through;
# the referer rule is live. Include after RewriteEngine on, before any other
# rule.
RewriteCond %{HTTP_HOST} ^www\.opengeofiction\.net$ [NC]
RewriteRule ^ - [R=404,L,E=nokeepalive:1]

<If "%{HTTP_HOST} =~ /^www\.opengeofiction\.net$/i">
    ErrorDocument 404 "This host is not served - please use https://opengeofiction.net/ instead of www.opengeofiction.net."
</If>

# www serves no pages, so a www referer is always bot-fabricated: the crawl
# above switched to the bare host while keeping its spoofed referer
RewriteCond %{HTTP_REFERER} ^https?://www\.opengeofiction\.net(:[0-9]+)?(/|$) [NC]
RewriteRule ^ - [F,L,E=nokeepalive:1]
