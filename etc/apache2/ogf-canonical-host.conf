# The site has one name, opengeofiction.net. www.opengeofiction.net exists
# only to send visitors there - it must never serve the site in parallel,
# which splits sessions, search results and OAuth redirect URIs between two
# hosts. Include this in every vhost that carries www. as a ServerAlias,
# after RewriteEngine on and before any other rule, in both the HTTP and the
# HTTPS vhost (certbot's -le-ssl twin included), so the redirect is one hop
# to the canonical https URL whichever way the request arrived. The query
# string is carried across by default.
RewriteCond %{HTTP_HOST} ^www\.opengeofiction\.net$ [NC]
RewriteRule ^ https://opengeofiction.net%{REQUEST_URI} [R=301,L]
