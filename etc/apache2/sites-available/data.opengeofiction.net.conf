# data.opengeofiction.net - static tree: planet backups, the minutely
# replication feed, the utility server's rsync'd outputs, extracts
<VirtualHost *:80>
    ServerName data.opengeofiction.net
    ServerAlias data.ogf
    ServerAdmin sysadmin@opengeofiction.net
    DocumentRoot /var/www/html/data.opengeofiction.net/public_html

    ErrorLog /var/www/html/data.opengeofiction.net/logs/error.log
    CustomLog /var/www/html/data.opengeofiction.net/logs/access.log combined

    RequestHeader unset Proxy early
    # the feed and the backups are fetched cross-origin by the tools
    Header always set Access-Control-Allow-Origin "*"

    <Directory /var/www/html/data.opengeofiction.net/public_html>
        Options +Indexes +FollowSymLinks
        IndexOptions FancyIndexing NameWidth=* SuppressDescription
        AllowOverride None
        Require all granted
    </Directory>

    # replication state changes every minute - never cache it
    <LocationMatch "^/replication/.*state\.txt$">
        Header set Cache-Control "no-cache, must-revalidate"
    </LocationMatch>
</VirtualHost>
