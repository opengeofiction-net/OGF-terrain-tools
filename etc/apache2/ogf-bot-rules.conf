# OpenGeofiction bot mitigation rules, Include'd by both the HTTP and HTTPS
# opengeofiction.net vhosts so the two cannot drift apart. The reasoning, the
# history and the tuning are on Admin:Production setup/Apache rules; that
# page is where changes are recorded first.
#
# Maintenance: bump the stale Chrome ceiling (<=136 below) every few months.
# Requires: RewriteEngine on, and RewriteMap editor-ips (both in the vhost).

# Element pages: block bare OGF root-URL referer (synthetic referer bypass).
# 10.33.7.* exempt - OGF-Patrol sends https://opengeofiction.net/ as referer
RewriteCond %{REMOTE_ADDR} !^10\.33\.7\. [NC]
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} ^https?://(www\.)?opengeofiction\.net/?$ [NC]
RewriteRule ^ - [F,L]

# Element pages: block bare Google homepage referer (synthetic referer bypass)
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} ^https?://(www\.)?google\.com/?$ [NC]
RewriteRule ^ - [F,L]

# Synthetic search-engine .net referers - real search engines use .com; the
# .net variants are always bot-fabricated. All-path block: zero FP risk
RewriteCond %{HTTP_REFERER} ^https?://(www\.)?(bing|baidu|yandex|yahoo|google)\.net/?$ [NC]
RewriteRule ^ - [F,L]

# Element pages: block stale Chrome (<=136) without referer. Edge excluded;
# known editor IPs excluded via the RewriteMap
RewriteCond ${editor-ips:%{REMOTE_ADDR}|NOTFOUND} =NOTFOUND
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} !. [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/537\.36 [NC]
RewriteCond %{HTTP_USER_AGENT} Chrome/(([1-9]?[0-9]|1[0-2][0-9]|13[0-6])\.0) [NC]
RewriteCond %{HTTP_USER_AGENT} !Edg/ [NC]
RewriteCond %{HTTP_USER_AGENT} !Edge/ [NC]
RewriteRule ^ - [F,L]

# Element pages: block rounded Chrome version (X.0.0.0 - never a real build)
# without referer. Edge excluded; the current stable band excluded (bump
# quarterly); known editor IPs excluded via the RewriteMap
RewriteCond ${editor-ips:%{REMOTE_ADDR}|NOTFOUND} =NOTFOUND
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} !. [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/537\.36 [NC]
RewriteCond %{HTTP_USER_AGENT} Chrome/[0-9]+\.0\.0\.0 [NC]
RewriteCond %{HTTP_USER_AGENT} !Chrome/(15[1-5])\.0\.0\.0 [NC]
RewriteCond %{HTTP_USER_AGENT} !Edg/ [NC]
RewriteCond %{HTTP_USER_AGENT} !Edge/ [NC]
RewriteRule ^ - [F,L]

# Element pages: block fake Windows NT 11.0 without referer
RewriteCond %{REQUEST_URI} ^/(relation|node|way|changeset)/\d+ [NC]
RewriteCond %{HTTP_REFERER} !. [NC]
RewriteCond %{HTTP_USER_AGENT} Windows\ NT\ 11\.0 [NC]
RewriteRule ^ - [F,L]

# Diary edit/hide actions without an OGF referer
RewriteCond %{REQUEST_URI} ^/user/.+/diary/(comments|\d+/(edit|hide|hidecomment/\d+))$ [NC]
RewriteCond %{HTTP_REFERER} !^https?://(www\.|wiki\.)?opengeofiction\.net [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/(537\.36|605\.1\.15) [NC]
RewriteRule ^ - [F,L]

# API scraping with browser-like UA and an off-site referer. Harmless on the
# HTTP vhost, where /api/ would only be redirected to HTTPS anyway
RewriteCond %{REQUEST_URI} ^/api/0\.6/ [NC]
RewriteCond %{HTTP_REFERER} !^https?://(www\.|wiki\.)?opengeofiction\.net [NC]
RewriteCond %{HTTP_USER_AGENT} AppleWebKit/(537\.36|605\.1\.15) [NC]
RewriteRule ^ - [F,L]

# Legacy wiki paths (wiki is on wiki.opengeofiction.net)
RewriteCond %{REQUEST_URI} ^/wiki.+ [NC]
RewriteRule ^ - [F,L]

# Meta link-preview crawler
RewriteCond %{HTTP_USER_AGENT} meta-externalagent [NC]
RewriteRule ^ - [F,L]

# Element page views without referer: block (distributed scraper farm).
# Exceptions: internal VPN, known editor IPs (RewriteMap)
RewriteCond ${editor-ips:%{REMOTE_ADDR}|NOTFOUND} =NOTFOUND
RewriteCond %{REMOTE_ADDR} !^10\.33\.7\. [NC]
RewriteCond %{REQUEST_URI} ^/(node|way|relation|changeset)/[0-9]+(/history)?$ [NC]
RewriteCond %{HTTP_REFERER} !. [NC]
RewriteRule ^ - [F,L]
